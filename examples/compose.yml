services:
  epicgames-freegames-node:
    image: ghcr.io/claabs/epicgames-freegames-node
    ports:
      - 3000:3000
    volumes:
      - /your/host/dir/config:/usr/app/config
    deploy:
      resources:
        limits:
          memory: 2G
    # https://playwright.dev/docs/docker#recommended-docker-configuration
    init: true
    ipc: host
    restart: unless-stopped
