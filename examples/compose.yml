services:
  epicgames-freegames-node:
    image: ghcr.io/claabs/epicgames-freegames-node
    ports:
      - 3000:3000
    volumes:
      - /your/host/dir/config:/usr/app/config
    resources:
      limits:
        memory: 2G
    # https://playwright.dev/docs/docker#recommended-docker-configuration
    init: true
    ipc: host
    # https://github.com/moby/profiles/blob/main/seccomp/default.json
    # https://github.com/microsoft/playwright/issues/30738#issuecomment-2108946980
    security_opt:
      - seccomp=seccomp_profile.json
      # or if you're lazy
      # - seccomp=unconfined
    restart: unless-stopped
