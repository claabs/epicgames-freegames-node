name: MultiArchDockerBuild

on:
  push:
    branches:
      - master
      - develop
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build_multi_arch_image:
    name: Build multi-arch Docker image.
    runs-on: ubuntu-latest
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            charlocharlie/epicgames-freegames,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            ghcr.io/claabs/epicgames-freegames-node,enable=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=debian,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push master
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BRANCH=${{ github.head_ref || github.ref_name }}
          cache-from: type=gha,scope=${{ github.workflow }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
